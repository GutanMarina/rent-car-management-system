<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Details</title>
    <link rel="stylesheet" th:href="@{/css/car-details.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">Rent<span>Car</span></div>

    <nav>
        <a href="/">Home</a>
        <a href="/#cars">Cars</a>
        <a href="/swagger-ui.html" target="_blank">API</a>
    </nav>
</header>

<section class="details-container">

    <div class="car-image-box">
        <img th:src="${car.imageUrl}" alt="Car image">
    </div>

    <div class="car-info">
        <span class="badge" th:text="${car.carType}">COMPACT</span>

        <h1 th:text="${car.brand + ' ' + car.model}">Mercedes A180d</h1>

        <p class="plate">
            License plate:
            <strong th:text="${car.licensePlate}">ABC123</strong>
        </p>

        <div class="info-grid">
            <div>
                <small>Fuel</small>
                <strong th:text="${car.fuelType}">DIESEL</strong>
            </div>

            <div>
                <small>Transmission</small>
                <strong th:text="${car.transmissionType}">AUTOMATIC</strong>
            </div>

            <div>
                <small>Seats</small>
                <strong th:text="${car.seats}">5</strong>
            </div>

            <div>
                <small>Status</small>
                <strong th:text="${car.status}">AVAILABLE</strong>
            </div>
        </div>

        <div class="price">
            <strong th:text="${car.pricePerDay + ' €'}">35 €</strong>
            <span>/ day</span>
        </div>
    </div>

</section>

<section class="reservation-section">
    <div class="reservation-card">
        <h2>Create Reservation</h2>

        <form id="reservationForm">
            <input type="hidden" id="carId" th:value="${car.id}">

            <div class="field">
                <label>User ID</label>
                <input type="number" id="userId" placeholder="Example: 1" required>
            </div>

            <div class="row">
                <div class="field">
                    <label>Start date</label>
                    <input type="date" id="startDate" required>
                </div>

                <div class="field">
                    <label>End date</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <div class="field">
                <label>Package</label>
                <select id="packageType">
                    <option value="STANDARD">Standard</option>
                    <option value="PREMIUM">Premium</option>
                </select>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="gps">
                    GPS
                </label>

                <label>
                    <input type="checkbox" id="childSeat">
                    Child Seat
                </label>

                <label>
                    <input type="checkbox" id="insurance">
                    Insurance
                </label>
            </div>

            <button type="submit">Create Reservation</button>
        </form>

        <div id="resultBox" class="result-box"></div>
    </div>
</section>

<script>
    document.getElementById("reservationForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const request = {
            carId: Number(document.getElementById("carId").value),
            userId: Number(document.getElementById("userId").value),
            startDate: document.getElementById("startDate").value,
            endDate: document.getElementById("endDate").value,
            gps: document.getElementById("gps").checked,
            childSeat: document.getElementById("childSeat").checked,
            insurance: document.getElementById("insurance").checked,
            packageType: document.getElementById("packageType").value
        };

        const resultBox = document.getElementById("resultBox");

        try {
            const response = await fetch("/reservations", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(request)
            });

            const data = await response.json();

            if (!response.ok) {
                resultBox.innerHTML = `<p class="error">${data.message || "Reservation failed"}</p>`;
                return;
            }

            resultBox.innerHTML = `
                <p class="success">Reservation created successfully!</p>
                <p><strong>ID:</strong> ${data.id}</p>
                <p><strong>Total price:</strong> ${data.totalPrice} €</p>
                <p><strong>Status:</strong> ${data.status}</p>
                <p><strong>Options:</strong> ${data.optionsDescription}</p>
                <a class="next-link" href="/reservation-page/${data.id}">Go to reservation details</a>
            `;
        } catch (error) {
            resultBox.innerHTML = `<p class="error">Something went wrong.</p>`;
        }
    });
</script>

</body>
</html>
